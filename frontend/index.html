<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Pipeline — Ask your documents</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>Ask your documents</h1>
    <p class="sub">Questions are answered only from retrieved passages, with sources cited below each answer.</p>
    <nav>
      <a href="index.html" class="active">Ask</a>
      <a href="upload.html">Upload documents</a>
    </nav>
  </header>

  <div class="ask">
    <input type="text" id="question" placeholder="e.g. what is concept drift and how do you detect it" autofocus>
    <button id="askBtn">Ask</button>
  </div>
  <p class="hint">Press Enter to submit</p>

  <div class="status" id="status"></div>
  <div class="answer" id="answer"></div>
  <div class="source-footer" id="sourceFooter"></div>

</div>

<script>
  const API_BASE = "http://localhost:8000";

  const questionEl = document.getElementById("question");
  const askBtn = document.getElementById("askBtn");
  const statusEl = document.getElementById("status");
  const answerEl = document.getElementById("answer");
  const sourceFooterEl = document.getElementById("sourceFooter");

  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") askQuestion();
  });
  askBtn.addEventListener("click", askQuestion);

  // Citations like "[1]" are still shown in the answer text (the model
  // still cites), just no longer clickable — there's no per-source panel
  // to link them to anymore, so this only handles the visual styling.
  function linkifyCitations(text) {
    return text.replace(/\[(\d+)\]/g, '<span class="citation">[$1]</span>');
  }

  // Plain, deduplicated list of source filenames under the answer —
  // enough to show the answer is grounded in real documents, without the
  // weight of a full per-passage panel.
  function renderSourceFooter(sources) {
    if (sources.length === 0) {
      sourceFooterEl.textContent = "";
      return;
    }
    const uniqueFiles = [...new Set(sources.map(s => s.source))];
    sourceFooterEl.textContent = `Sources: ${uniqueFiles.join(" · ")}`;
  }

  async function askQuestion() {
    const question = questionEl.value.trim();
    if (!question) return;

    askBtn.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "Searching documents...";
    answerEl.innerHTML = "";
    sourceFooterEl.textContent = "";

    try {
      const res = await fetch(`${API_BASE}/query/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok || !res.body) {
        throw new Error(`Request failed (${res.status})`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let rawAnswer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const events = buffer.split("\n\n");
        buffer = events.pop();

        for (const raw of events) {
          const eventLine = raw.split("\n").find(l => l.startsWith("event:"));
          const dataLine = raw.split("\n").find(l => l.startsWith("data:"));
          if (!eventLine || !dataLine) continue;

          const eventType = eventLine.replace("event:", "").trim();
          const data = JSON.parse(dataLine.replace("data:", "").trim());

          if (eventType === "sources") {
            renderSourceFooter(data);
            statusEl.textContent = data.length > 0
              ? `Found ${data.length} passages. Generating answer...`
              : "No matching passages found.";
          } else if (eventType === "token") {
            rawAnswer += data.text;
            answerEl.innerHTML = linkifyCitations(rawAnswer);
          } else if (eventType === "done") {
            statusEl.textContent = "";
          } else if (eventType === "error") {
            statusEl.className = "status error";
            statusEl.textContent = data.message;
          }
        }
      }
    } catch (err) {
      statusEl.className = "status error";
      statusEl.textContent = `Error: ${err.message}. Is the API running at ${API_BASE}?`;
    } finally {
      askBtn.disabled = false;
    }
  }
</script>
</body>
</html>
